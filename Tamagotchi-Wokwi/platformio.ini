; Configuracion de PlatformIO para Roberto (ESP32-S3 + ILI9341)
; Compilar: boton ✓ de la barra inferior de VS Code (o "pio run")
; Simular: F1 -> "Wokwi: Start Simulator" (usa wokwi.toml + diagram.json)

[platformio]
; El codigo vive en esta misma carpeta (sketch.ino + .h), no en src/
src_dir = .

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; Mas espacio para el programa (WiFi + HTTPS + fondos RLE pesan bastante)
board_build.partitions = huge_app.csv
; Solo compilar el codigo propio, no lo que hay en .pio/ ni .vscode/
build_src_filter = +<*> -<.pio/> -<.vscode/>
lib_deps =
    adafruit/Adafruit ILI9341
    adafruit/Adafruit GFX Library
    bblanchon/ArduinoJson@^7
