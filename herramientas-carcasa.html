<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Chaca - Diagrama de carcasa</title>
<style>
@page { size: A4 landscape; margin: 0; }
html, body { margin: 0; padding: 0; background: #fff; }
.hoja { width: 297mm; height: 210mm; page-break-after: always; overflow: hidden; }
.hoja:last-child { page-break-after: auto; }
svg { display: block; font-family: 'Segoe UI', Arial, sans-serif; }
.t1 { font-size: 7px; font-weight: 700; fill: #2b5d8a; }
.t2 { font-size: 4px; font-weight: 700; fill: #2b5d8a; }
.tx { font-size: 3.2px; fill: #222; }
.tc { font-size: 2.6px; fill: #333; }
.chico { font-size: 2.3px; fill: #555; }
.cota { stroke: #777; stroke-width: 0.25; fill: none; }
.caja { fill: #f6cfcb; stroke: #b33a33; stroke-width: 0.7; }
.interior { fill: none; stroke: #b33a33; stroke-width: 0.3; stroke-dasharray: 1.5 1; }
.punteado { fill: none; stroke: #444; stroke-width: 0.35; stroke-dasharray: 1.2 0.8; }
.corte { fill: #fff; stroke: #111; stroke-width: 0.45; }
.pieza { stroke: #333; stroke-width: 0.4; }
</style></head><body>

<!-- ================= HOJA 1: VISTA DE ARRIBA ================= -->
<div class="hoja"><svg width="297mm" height="210mm" viewBox="0 0 297 210">
  <text x="12" y="16" class="t1">Chaca · Carcasa estilo Pokédex · 1. Vista de arriba (parte de abajo, abierta)</text>
  <text x="12" y="22" class="tx">Escala 1:1 — imprimir al 100% ("tamaño real", sin "ajustar a la página"). Comprobá con una regla que la caja mida 150 mm de ancho.</text>

  <g transform="translate(34,38)">
    <!-- bisagra y tapa (solo indicada) -->
    <rect x="10" y="-10" width="130" height="7" rx="2" fill="#e0e0e0" stroke="#666" stroke-width="0.4"/>
    <text x="75" y="-5.2" class="tc" text-anchor="middle">bisagra → la tapa lisa se abre hacia arriba (misma medida: 150 × 100 mm)</text>
    <!-- caja -->
    <rect x="0" y="0" width="150" height="100" rx="8" class="caja"/>
    <rect x="3" y="3" width="144" height="94" rx="6" class="interior"/>

    <!-- pantalla: modulo y ventana -->
    <rect x="54" y="11.5" width="42" height="77" class="punteado"/>
    <text x="75" y="92.2" class="chico" text-anchor="middle">placa de la pantalla 42 × 77 (por debajo)</text>
    <rect x="56" y="22" width="38" height="50" class="corte"/>
    <text x="75" y="45" class="t2" text-anchor="middle">VENTANA</text>
    <text x="75" y="50" class="tc" text-anchor="middle">pantalla 38 × 50 mm</text>
    <text x="75" y="54" class="chico" text-anchor="middle">(marcar sobre la</text>
    <text x="75" y="57" class="chico" text-anchor="middle">pantalla real)</text>
    <text x="75" y="19.5" class="chico" text-anchor="middle">↑ lado de la ranura SD</text>
    <text x="75" y="84" class="chico" text-anchor="middle">↓ lado de los 9 pines</text>

    <!-- buzzer: agujeritos tipo parlante pokedex -->
    <rect x="16" y="42.5" width="18.5" height="15" class="punteado"/>
    <g fill="#222">
      <circle cx="21" cy="46.5" r="1.4"/><circle cx="29.5" cy="46.5" r="1.4"/>
      <circle cx="25.25" cy="50" r="1.4"/>
      <circle cx="21" cy="53.5" r="1.4"/><circle cx="29.5" cy="53.5" r="1.4"/>
    </g>
    <text x="25.25" y="40.5" class="tc" text-anchor="middle">BUZZER</text>
    <text x="25.25" y="61" class="chico" text-anchor="middle">agujeritos Ø 3 mm</text>
    <text x="25.25" y="63.8" class="chico" text-anchor="middle">(módulo 18,5 × 15 abajo)</text>

    <!-- botones -->
    <g>
      <circle cx="122" cy="30" r="5" class="corte"/><text x="122" y="31.2" class="tc" text-anchor="middle">NAV</text>
      <circle cx="122" cy="50" r="5" class="corte"/><text x="122" y="51.2" class="tc" text-anchor="middle">SEL</text>
      <circle cx="122" cy="70" r="5" class="corte"/><text x="122" y="71.2" class="tc" text-anchor="middle">ATRÁS</text>
    </g>
    <text x="122" y="20.5" class="tc" text-anchor="middle">BOTONES Ø 10 mm*</text>

    <!-- agujerito BOOT -->
    <circle cx="140" cy="88" r="1.2" class="corte"/>
    <text x="137.5" y="94" class="chico" text-anchor="end">agujerito BOOT Ø 2,5 (palillo)</text>

    <!-- cortes en las paredes -->
    <rect x="-1.5" y="12" width="4" height="9" fill="#fff" stroke="#111" stroke-width="0.45"/>
    <text x="-3" y="15" class="chico" text-anchor="end">USB carga</text>
    <text x="-3" y="18" class="chico" text-anchor="end">batería (TP4056)</text>
    <rect x="-1.5" y="31" width="4" height="8" fill="#fff" stroke="#111" stroke-width="0.45"/>
    <text x="-3" y="34" class="chico" text-anchor="end">Interruptor</text>
    <text x="-3" y="37" class="chico" text-anchor="end">ON / OFF</text>
    <rect x="147.5" y="71" width="4" height="10" fill="#fff" stroke="#111" stroke-width="0.45"/>
    <text x="153" y="75" class="chico">USB-C ESP32</text>
    <text x="153" y="78" class="chico">(subir código)</text>

    <!-- cotas -->
    <line x1="0" y1="108" x2="150" y2="108" class="cota"/>
    <line x1="0" y1="105.5" x2="0" y2="110.5" class="cota"/><line x1="150" y1="105.5" x2="150" y2="110.5" class="cota"/>
    <text x="75" y="113" class="tx" text-anchor="middle">150 mm</text>
    <line x1="-14" y1="0" x2="-14" y2="100" class="cota"/>
    <line x1="-16.5" y1="0" x2="-11.5" y2="0" class="cota"/><line x1="-16.5" y1="100" x2="-11.5" y2="100" class="cota"/>
    <text x="-15.5" y="50" class="tx" text-anchor="middle" transform="rotate(-90 -15.5 50)">100 mm</text>
  </g>

  <g transform="translate(208,40)">
    <text x="0" y="0" class="t2">Cómo se lee</text>
    <text x="0" y="7" class="tx">▭ Línea llena con fondo blanco = agujero / corte</text>
    <text x="0" y="12" class="tx">▭ Línea punteada = pieza que va por debajo</text>
    <text x="0" y="17" class="tx">Paredes de 3 mm (línea punteada roja interior)</text>
    <text x="0" y="28" class="t2">Altura de la caja</text>
    <text x="0" y="35" class="tx">Parte de abajo: alto interior mínimo 30 mm</text>
    <text x="0" y="40" class="tx">(ESP32 con pines hembra + batería + cables).</text>
    <text x="0" y="45" class="tx">Tapa de arriba: lisa, sin nada, 150 × 100 mm.</text>
    <text x="0" y="56" class="t2">A tener en cuenta</text>
    <text x="0" y="63" class="tx">• La pantalla va VERTICAL (más alta que ancha).</text>
    <text x="0" y="68" class="tx">• Medir la ventana sobre la pantalla real: el</text>
    <text x="0" y="72.5" class="tx">  vidrio no está centrado en la placa roja.</text>
    <text x="0" y="78" class="tx">• * Medir los botones que me dieron y ajustar</text>
    <text x="0" y="82.5" class="tx">  el agujero (botón + 0,5 mm).</text>
    <text x="0" y="88" class="tx">• Pantalla, botones y buzzer se pegan del lado</text>
    <text x="0" y="92.5" class="tx">  de adentro de la cara de arriba.</text>
    <text x="0" y="98" class="tx">• El agujerito BOOT queda justo arriba del botón</text>
    <text x="0" y="102.5" class="tx">  BOOT de la ESP32 (ver hoja 2).</text>
  </g>
</svg></div>

<!-- ================= HOJA 2: VISTA DE ADENTRO ================= -->
<div class="hoja"><svg width="297mm" height="210mm" viewBox="0 0 297 210">
  <text x="12" y="16" class="t1">2. Vista de adentro: dónde va cada pieza (piso de la caja)</text>
  <text x="12" y="22" class="tx">Escala 1:1. Lo que está en gris claro con borde punteado está en la cara de arriba (pantalla, botones, buzzer), solo como referencia.</text>

  <g transform="translate(34,38)">
    <rect x="0" y="0" width="150" height="100" rx="8" class="caja"/>
    <rect x="3" y="3" width="144" height="94" rx="6" class="interior"/>

    <!-- TP4056 -->
    <rect x="4" y="8" width="26" height="17" fill="#6fa8dc" fill-opacity="0.8" class="pieza"/>
    <text x="17" y="15.5" class="tc" text-anchor="middle">CARGADOR</text>
    <text x="17" y="19" class="chico" text-anchor="middle">TP4056 26×17</text>
    <text x="17" y="22" class="chico" text-anchor="middle">USB → pared izq.</text>
    <!-- interruptor -->
    <rect x="4" y="32" width="12" height="6" fill="#999" class="pieza"/>
    <text x="18" y="36.3" class="chico">interruptor</text>
    <!-- step up -->
    <rect x="35" y="8" width="37" height="17" fill="#93c47d" fill-opacity="0.85" class="pieza"/>
    <text x="53.5" y="15.5" class="tc" text-anchor="middle">STEP-UP 5 V</text>
    <text x="53.5" y="19" class="chico" text-anchor="middle">MT3608 37×17 (aprox.)</text>
    <!-- bateria -->
    <rect x="8" y="50" width="50" height="34" rx="2" fill="#ffd966" fill-opacity="0.9" class="pieza"/>
    <text x="33" y="64" class="tc" text-anchor="middle">BATERÍA LiPo</text>
    <text x="33" y="68" class="chico" text-anchor="middle">50 × 34 (ejemplo:</text>
    <text x="33" y="71" class="chico" text-anchor="middle">medir la real)*</text>
    <!-- placa perforada + esp32 -->
    <rect x="77" y="56" width="70" height="40" fill="#d9c7a3" fill-opacity="0.6" class="pieza" stroke-dasharray="1 0.6"/>
    <text x="79" y="60" class="chico">placa perforada 70 × 40</text>
    <rect x="90" y="62" width="55" height="28" rx="1.5" fill="#333" class="pieza"/>
    <text x="114" y="74" class="tc" text-anchor="middle" fill="#fff" style="fill:#fff">ESP32  55 × 28</text>
    <text x="114" y="78" class="chico" text-anchor="middle" style="fill:#ddd">sobre tiras de pines hembra</text>
    <rect x="143" y="72" width="5" height="8" fill="#bbb" stroke="#111" stroke-width="0.3"/>
    <text x="141" y="70.5" class="chico" text-anchor="end" style="fill:#fff">USB-C →</text>
    <circle cx="140" cy="88" r="1.6" fill="#fff" stroke="#c00" stroke-width="0.4"/>
    <text x="137" y="88.8" class="chico" text-anchor="end" style="fill:#fff">BOOT</text>

    <!-- referencia cara de arriba -->
    <rect x="54" y="11.5" width="42" height="77" fill="none" class="punteado" style="stroke:#555;stroke-width:0.45"/>
    <text x="70" y="86" class="chico" text-anchor="middle">pantalla (arriba)</text>
    <rect x="16" y="42.5" width="18.5" height="15" fill="none" class="punteado" style="stroke:#555;stroke-width:0.45"/>
    <text x="44" y="47" class="chico">buzzer (arriba)</text>
    <circle cx="122" cy="30" r="5" fill="none" class="punteado" style="stroke:#555;stroke-width:0.45"/>
    <circle cx="122" cy="50" r="5" fill="none" class="punteado" style="stroke:#555;stroke-width:0.45"/>
    <circle cx="122" cy="70" r="5" fill="none" class="punteado" style="stroke:#555;stroke-width:0.45"/>

    <text x="122" y="20.5" class="chico" text-anchor="middle">botones (arriba)</text>
    <!-- recorrido de cables de energia -->
    <path d="M30 16.5 L35 16.5" stroke="#c00" stroke-width="0.6" fill="none"/>
    <path d="M20 25 L20 32" stroke="#c00" stroke-width="0.6" fill="none"/>
    <path d="M72 16.5 L84 16.5 L84 66 L90 66" stroke="#c00" stroke-width="0.6" fill="none" stroke-dasharray="2 1"/>
    <text x="85.5" y="40" class="chico">5 V → VIN</text>
    <path d="M33 50 L33 30 L17 30 L17 25" stroke="#c00" stroke-width="0.6" fill="none" stroke-dasharray="2 1"/>
    <text x="34.5" y="44" class="chico">B+ / B−</text>

    <!-- cotas -->
    <line x1="0" y1="108" x2="150" y2="108" class="cota"/>
    <text x="75" y="113" class="tx" text-anchor="middle">150 mm</text>
  </g>

  <g transform="translate(208,40)">
    <text x="0" y="0" class="t2">Cómo se acomoda</text>
    <text x="0" y="7" class="tx">• Abajo de todo (piso): batería, cargador,</text>
    <text x="0" y="11.5" class="tx">  step-up, interruptor y la placa perforada</text>
    <text x="0" y="16" class="tx">  con la ESP32.</text>
    <text x="0" y="21.5" class="tx">• Arriba (pegados a la tapa de abajo, por</text>
    <text x="0" y="26" class="tx">  dentro): pantalla, 3 botones y buzzer,</text>
    <text x="0" y="30.5" class="tx">  unidos a la ESP32 con cables flexibles.</text>
    <text x="0" y="36" class="tx">• El USB-C de la ESP32 apoyado contra la pared</text>
    <text x="0" y="40.5" class="tx">  derecha, para subir código sin abrir.</text>
    <text x="0" y="46" class="tx">• El USB del cargador contra la pared izquierda.</text>
    <text x="0" y="51.5" class="tx">• El botón BOOT de la ESP32 queda debajo del</text>
    <text x="0" y="56" class="tx">  agujerito de la hoja 1.</text>
    <text x="0" y="67" class="t2">Alturas aproximadas</text>
    <text x="0" y="74" class="tx">Placa perforada + pines hembra + ESP32 ≈ 15 mm</text>
    <text x="0" y="79" class="tx">Batería LiPo ≈ 5 a 10 mm</text>
    <text x="0" y="84" class="tx">Pantalla + pines ≈ 12 mm · Botones ≈ 5 a 10 mm</text>
    <text x="0" y="89" class="tx">→ Por eso, 30 mm de alto interior.</text>
    <text x="0" y="99" class="tx">* Si la batería es más grande, se corre la</text>
    <text x="0" y="103.5" class="tx">  batería; la ESP32 queda donde está.</text>
  </g>
</svg></div>

<!-- ================= HOJA 3: CONEXIONES ================= -->
<div class="hoja"><svg width="297mm" height="210mm" viewBox="0 0 297 210">
  <text x="12" y="16" class="t1">3. Conexiones: qué se suelda con qué</text>

  <!-- cadena de energia -->
  <text x="14" y="30" class="t2">Energía (de la batería a la placa)</text>
  <g transform="translate(14,36)" font-size="3.4">
    <rect x="0" y="0" width="36" height="20" rx="2" fill="#ffd966" stroke="#333" stroke-width="0.4"/>
    <text x="18" y="9" class="tx" text-anchor="middle" font-weight="700">BATERÍA LiPo</text>
    <text x="18" y="14" class="chico" text-anchor="middle">3,7 V</text>
    <rect x="52" y="0" width="40" height="20" rx="2" fill="#6fa8dc" stroke="#333" stroke-width="0.4"/>
    <text x="72" y="9" class="tx" text-anchor="middle" font-weight="700">CARGADOR TP4056</text>
    <text x="72" y="14" class="chico" text-anchor="middle">con protección (6 contactos)</text>
    <rect x="108" y="0" width="30" height="20" rx="2" fill="#bbb" stroke="#333" stroke-width="0.4"/>
    <text x="123" y="9" class="tx" text-anchor="middle" font-weight="700">INTERRUPTOR</text>
    <text x="123" y="14" class="chico" text-anchor="middle">solo el cable +</text>
    <rect x="154" y="0" width="38" height="20" rx="2" fill="#93c47d" stroke="#333" stroke-width="0.4"/>
    <text x="173" y="9" class="tx" text-anchor="middle" font-weight="700">STEP-UP</text>
    <text x="173" y="14" class="chico" text-anchor="middle">ajustado a 5,0 V</text>
    <rect x="208" y="0" width="34" height="20" rx="2" fill="#333" stroke="#333" stroke-width="0.4"/>
    <text x="225" y="9" class="tx" text-anchor="middle" font-weight="700" style="fill:#fff">ESP32</text>
    <text x="225" y="14" class="chico" text-anchor="middle" style="fill:#ddd">VIN y GND</text>
    <g stroke="#c00" stroke-width="0.7"><line x1="36" y1="10" x2="52" y2="10"/><line x1="92" y1="10" x2="108" y2="10"/><line x1="138" y1="10" x2="154" y2="10"/><line x1="192" y1="10" x2="208" y2="10"/></g>
    <text x="44" y="7.5" class="chico" text-anchor="middle">→ B+ / B−</text>
    <text x="100" y="7.5" class="chico" text-anchor="middle">OUT+</text>
    <text x="146" y="7.5" class="chico" text-anchor="middle">IN+</text>
    <text x="200" y="7.5" class="chico" text-anchor="middle">OUT+ → VIN</text>
    <text x="0" y="28" class="tx">Los negativos (B−, OUT−, IN−, OUT− del step-up) van todos juntos al GND de la ESP32. El interruptor corta solo el cable positivo.</text>
  </g>

  <!-- tabla de senales -->
  <text x="14" y="76" class="t2">Señales (cables de la ESP32 a cada cosa)</text>
  <g transform="translate(14,80)">
    <rect x="0" y="0" width="128" height="7" fill="#e8f1f9"/>
    <text x="2" y="5" class="tc" font-weight="700">Pieza · pin</text><text x="62" y="5" class="tc" font-weight="700">→ ESP32</text><text x="88" y="5" class="tc" font-weight="700">Color sugerido</text>
    <g class="tc">
      <text x="2" y="12">Pantalla · VCC</text><text x="62" y="12">3V3</text><text x="88" y="12">rojo</text>
      <text x="2" y="17">Pantalla · LED</text><text x="62" y="17">3V3</text><text x="88" y="17">rojo</text>
      <text x="2" y="22">Pantalla · GND</text><text x="62" y="22">GND</text><text x="88" y="22">negro</text>
      <text x="2" y="27">Pantalla · CS</text><text x="62" y="27">G5</text><text x="88" y="27">blanco</text>
      <text x="2" y="32">Pantalla · RESET</text><text x="62" y="32">G22</text><text x="88" y="32">naranja</text>
      <text x="2" y="37">Pantalla · DC</text><text x="62" y="37">G21</text><text x="88" y="37">amarillo</text>
      <text x="2" y="42">Pantalla · SDI (MOSI)</text><text x="62" y="42">G23</text><text x="88" y="42">verde</text>
      <text x="2" y="47">Pantalla · SCK</text><text x="62" y="47">G18</text><text x="88" y="47">azul</text>
      <text x="2" y="52">Pantalla · SDO (MISO)</text><text x="62" y="52">G19</text><text x="88" y="52">violeta</text>
      <text x="2" y="57">Buzzer · S</text><text x="62" y="57">G26</text><text x="88" y="57">gris</text>
      <text x="2" y="62">Buzzer · +  /  −</text><text x="62" y="62">3V3 / GND</text><text x="88" y="62">rojo / negro</text>
      <text x="2" y="67">Botón NAV</text><text x="62" y="67">G32 y GND</text><text x="88" y="67">—</text>
      <text x="2" y="72">Botón SELECT</text><text x="62" y="72">G33 y GND</text><text x="88" y="72">—</text>
      <text x="2" y="77">Botón ATRÁS</text><text x="62" y="77">G25 y GND</text><text x="88" y="77">—</text>
    </g>
    <g stroke="#c9d8e6" stroke-width="0.25">
      <line x1="0" y1="7" x2="128" y2="7"/><line x1="0" y1="24" x2="128" y2="24"/><line x1="0" y1="54" x2="128" y2="54"/><line x1="0" y1="64" x2="128" y2="64"/><line x1="0" y1="79" x2="128" y2="79"/>
    </g>
  </g>

  <g transform="translate(160,80)">
    <text x="0" y="0" class="t2">Importante</text>
    <text x="0" y="7" class="tx">• 3V3 es una SALIDA: alimenta pantalla y buzzer.</text>
    <text x="0" y="12" class="tx">  Nunca le llega la batería ni el step-up.</text>
    <text x="0" y="18" class="tx">• La energía entra por VIN (5 V del step-up).</text>
    <text x="0" y="24" class="tx">• Todos los GND unidos (batería, módulos,</text>
    <text x="0" y="29" class="tx">  ESP32, pantalla, buzzer y botones).</text>
    <text x="0" y="35" class="tx">• Botones: de cada uno, una patita al pin y otra</text>
    <text x="0" y="40" class="tx">  a GND. Sin resistencias (la ESP32 usa su</text>
    <text x="0" y="45" class="tx">  resistencia interna, INPUT_PULLUP).</text>
    <text x="0" y="51" class="tx">• Pulsador de 4 patitas: las patitas están unidas</text>
    <text x="0" y="56" class="tx">  de a pares por dentro. Usar dos en diagonal.</text>
    <text x="0" y="62" class="tx">• En el pin "5V" de la ESP32 NO va nada.</text>
    <text x="0" y="68" class="tx">• Pines G6 a G11 NO se usan (son de la memoria).</text>
  </g>
</svg></div>

<!-- ================= HOJA 4: MEDIDAS Y CONSEJOS ================= -->
<div class="hoja"><svg width="297mm" height="210mm" viewBox="0 0 297 210">
  <text x="12" y="16" class="t1">4. Antes de cortar y soldar</text>

  <g transform="translate(14,30)">
    <text x="0" y="0" class="t2">Medir y anotar (las medidas del diagrama son típicas)</text>
    <g class="tx">
      <text x="0" y="9">☐ Pantalla: placa roja (largo × ancho): ________  ·  vidrio visible: ________</text>
      <text x="0" y="16">☐ Pantalla: distancia del vidrio al borde de la ranura SD: ________</text>
      <text x="0" y="23">☐ Botones: diámetro del botoncito: ________  ·  alto: ________</text>
      <text x="0" y="30">☐ Batería: largo × ancho × alto: ________</text>
      <text x="0" y="37">☐ Cargador TP4056: ________  ·  Step-up: ________  ·  Interruptor: ________</text>
      <text x="0" y="44">☐ ESP32 con pines (largo × ancho × alto): ________</text>
      <text x="0" y="51">☐ Buzzer (módulo): ________</text>
    </g>

    <text x="0" y="68" class="t2">Al soldar</text>
    <g class="tx">
      <text x="0" y="77">• La ESP32 va sobre <tspan font-weight="700">tiras de pines hembra</tspan> soldadas a la placa perforada: así se puede sacar y cambiar sin desoldar.</text>
      <text x="0" y="84">• Lo que va en la cara de arriba (pantalla, botones, buzzer) se une con <tspan font-weight="700">cable flexible</tspan> (multifilar), dejando 3 a 4 cm de más.</text>
      <text x="0" y="91">• <tspan font-weight="700">Step-up:</tspan> ajustar el tornillito a <tspan font-weight="700">5,0 V con el tester ANTES</tspan> de conectarlo a la ESP32 (puede venir dando más).</text>
      <text x="0" y="98">• Soldar <tspan font-weight="700">sin la batería conectada</tspan>. No invertir B+ y B−: el cargador no tiene protección contra eso.</text>
      <text x="0" y="105">• Cargador TP4056: usar la versión <tspan font-weight="700">con protección</tspan> (6 contactos: IN, B+/B−, OUT+/OUT−).</text>
      <text x="0" y="112">• Cubrir cada soldadura con <tspan font-weight="700">termocontraíble</tspan> o cinta, para que nada se toque dentro de la caja.</text>
      <text x="0" y="119">• Probar todo en la protoboard ANTES de soldar, y después de soldar, probar antes de cerrar la caja.</text>
    </g>

    <text x="0" y="136" class="t2">Para probar con el tester (antes de enchufar la ESP32)</text>
    <g class="tx">
      <text x="0" y="145">1. Batería: entre 3,7 y 4,2 V.   2. Salida del step-up (con el interruptor en ON): 5,0 V.</text>
      <text x="0" y="152">3. Entre 3V3 y GND no tiene que haber continuidad (si el tester "pita", hay un cortocircuito).</text>
    </g>
  </g>
</svg></div>

  <g transform="translate(170,34)"><text x="0" y="0.0" class="t2" xml:space="preserve">Cómo se arma, paso a paso</text>
<text x="0" y="4.6" class="tx" xml:space="preserve"><tspan font-weight="700">1.</tspan> Soldar 2 tiras de 19 pines HEMBRA, separadas</text>
<text x="0" y="9.2" class="tx" xml:space="preserve">   10 agujeros. La ESP32 se ENCHUFA ahí: no se suelda.</text>
<text x="0" y="13.8" class="tx" xml:space="preserve">   (Medir: si las filas de mi ESP32 quedan a 9, usar 9.)</text>
<text x="0" y="20.6" class="tx" xml:space="preserve"><tspan font-weight="700">2.</tspan> Soldar tiras de pines MACHO (amarillo) para cada</text>
<text x="0" y="25.2" class="tx" xml:space="preserve">   cosa: pantalla (9), botones (4), buzzer (3), energía (2).</text>
<text x="0" y="29.8" class="tx" xml:space="preserve">   Así todo se conecta con cables dupont hembra.</text>
<text x="0" y="36.6" class="tx" xml:space="preserve"><tspan font-weight="700">3.</tspan> Hacer los 2 rieles con alambre desnudo por abajo:</text>
<text x="0" y="41.2" class="tx" xml:space="preserve">   arriba GND (negro), abajo 3V3 (rojo).</text>
<text x="0" y="48.0" class="tx" xml:space="preserve"><tspan font-weight="700">4.</tspan> Unir con cablecitos por abajo, como las líneas de</text>
<text x="0" y="52.6" class="tx" xml:space="preserve">   colores. Un cable por vez, tachando en la hoja 3.</text>
<text x="0" y="59.4" class="tx" xml:space="preserve"><tspan font-weight="700">5.</tspan> Antes de enchufar la ESP32: con el tester, que NO</text>
<text x="0" y="64.0" class="tx" xml:space="preserve">   haya continuidad entre el riel 3V3 y el riel GND.</text>
<text x="0" y="70.8" class="tx" xml:space="preserve"><tspan font-weight="700">6.</tspan> Enchufar la ESP32 con el USB-C a la derecha,</text>
<text x="0" y="75.4" class="tx" xml:space="preserve">   como en el dibujo, y probar con USB antes de</text>
<text x="0" y="80.0" class="tx" xml:space="preserve">   conectar la batería.</text>
<text x="0" y="86.8" class="t2" xml:space="preserve">Ojo</text>
<text x="0" y="91.4" class="tx" xml:space="preserve">• Los nombres de los pines son los de mi placa, vista</text>
<text x="0" y="96.0" class="tx" xml:space="preserve">  desde arriba con el USB a la derecha. Revisarlos con</text>
<text x="0" y="100.6" class="tx" xml:space="preserve">  lo que dice impreso antes de soldar.</text>
<text x="0" y="105.2" class="tx" xml:space="preserve">• "ENTRA 5 V" es donde llega el cable del step-up. Va al</text>
<text x="0" y="109.8" class="tx" xml:space="preserve">  pin 5V de la ESP32 (es la entrada VIN).</text>
<text x="0" y="114.4" class="tx" xml:space="preserve">• Botones: cada uno lleva 2 cables, uno a su pin</text>
<text x="0" y="119.0" class="tx" xml:space="preserve">  (NAV / SEL / ATR) y otro al GND de ese conector.</text>
<text x="0" y="123.6" class="tx" xml:space="preserve">• Los cables que se cruzan van aislados (no se tocan).</text></g>
